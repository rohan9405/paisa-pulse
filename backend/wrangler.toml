# drip config backend. Deploy: see backend/README.md
name = "drip-config"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Created with `npx wrangler kv namespace create CONFIG`.
[[kv_namespaces]]
binding = "CONFIG"
id = "76c6a9394fad41519bb428a34239af30"

[observability]
enabled = false

# Anonymous usage counters (src/usage.ts). Created with `npx wrangler d1 create drip-usage`; tables: usage.sql.
[[d1_databases]]
binding = "USAGE"
database_name = "drip-usage"
database_id = "dba0e52c-0180-4c5a-9988-4c3cef364cbd"
