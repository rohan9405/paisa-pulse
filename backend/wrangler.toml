# drip config backend. Deploy: see backend/README.md
name = "drip-config"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Created with `npx wrangler kv namespace create CONFIG`; the id is filled in on first deploy.
[[kv_namespaces]]
binding = "CONFIG"
id = "REPLACE_WITH_KV_ID"

[observability]
enabled = false
